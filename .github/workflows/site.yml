name: Development website

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild so lab members' latest publications appear automatically.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: website-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'metrics-and-models/dev' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PATH_PREFIX: ''
      SITE_URL: https://metrics-and-models.ai
      SITE_ENV: preview
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falls back to the committed publications.json if OpenAlex is unavailable.
      - name: Refresh publications from OpenAlex
        run: npm run publications
        continue-on-error: true
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v4
        if: github.repository == 'metrics-and-models/dev' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # The rebuilt site deploys only to the separate dev repository, never production.
    if: github.repository == 'metrics-and-models/dev' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

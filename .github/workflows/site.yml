name: Website

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PATH_PREFIX: ${{ (github.repository != 'metrics-and-models/metrics-and-models.github.io' || github.ref != 'refs/heads/main') && '/dev' || '' }}
      SITE_URL: https://metrics-and-models.github.io
      SITE_ENV: ${{ github.repository == 'metrics-and-models/metrics-and-models.github.io' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v4
        if: (github.repository == 'metrics-and-models/dev' || github.repository == 'metrics-and-models/metrics-and-models.github.io') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # Only main deploys: the source repository is production; the dev repository is a preview.
    if: (github.repository == 'metrics-and-models/dev' || github.repository == 'metrics-and-models/metrics-and-models.github.io') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
